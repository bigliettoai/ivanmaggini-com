# Configurazione Netlify per ivanmaggini.com
#
# Il sito è composto da soli file statici: non c'è nessuno step di build, la
# cartella del repository viene pubblicata così com'è.

[build]
  publish = "."
  command = ""

# La radice del repository viene pubblicata tutta, quindi anche i file di
# lavoro sarebbero leggibili da chiunque. Rispondono con la pagina di errore e
# lo stato 404. force = true serve perché questi file esistono davvero, e
# senza forzatura Netlify servirebbe il file invece della regola. Stanno in
# testa, perché vale la prima regola che corrisponde.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PRODUCT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.impeccable/*"
  to = "/404.html"
  status = 404
  force = true

# URL puliti. Netlify offre già la funzione "Pretty URLs", ma dichiarare le
# riscritture qui rende le rotte indipendenti da quell'impostazione: /studio
# serve studio.html senza redirect visibile all'utente né cambio di URL.
[[redirects]]
  from = "/biglietto"
  to = "/biglietto.html"
  status = 200

[[redirects]]
  from = "/en/biglietto"
  to = "/en/biglietto.html"
  status = 200

# La sezione si chiamava "startup" nella prima versione del sito: chi ha
# ancora quel link in giro finisce sulla pagina giusta.
[[redirects]]
  from = "/startup"
  to = "/biglietto"
  status = 301

[[redirects]]
  from = "/en/startup"
  to = "/en/biglietto"
  status = 301

[[redirects]]
  from = "/studio"
  to = "/studio.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/condizioni"
  to = "/condizioni.html"
  status = 200

# Il modulo di contatto non esiste più: si scrive una email e basta. La pagina
# di conferma è stata rimossa, ma la sua rotta resta mappata sulla home perché
# qualcuno potrebbe averla ancora fra i preferiti o in un vecchio messaggio.
[[redirects]]
  from = "/grazie"
  to = "/"
  status = 301

# Versione inglese. Ogni pagina italiana ha la sua controparte; le
# condizioni in inglese si chiamano /en/terms.
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/en/studio"
  to = "/en/studio.html"
  status = 200

[[redirects]]
  from = "/en/privacy"
  to = "/en/privacy.html"
  status = 200

[[redirects]]
  from = "/en/terms"
  to = "/en/terms.html"
  status = 200

# Qualunque altro percorso sotto /en/ riceve la pagina di errore inglese,
# non quella italiana.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

# Il dominio è ivanmaggini.com senza www: la variante con www viene
# reindirizzata in modo permanente per non spezzare l'indicizzazione.
[[redirects]]
  from = "https://www.ivanmaggini.com/*"
  to = "https://ivanmaggini.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Il foglio di stile viene richiamato con l'impronta del suo contenuto
# nell'indirizzo (`?v=...`), quindi una modifica cambia l'URL e la copia
# vecchia non può più essere servita. La rivalidazione a ogni richiesta è la
# seconda rete: se un giorno l'impronta non venisse rigenerata, il browser se
# ne accorgerebbe lo stesso. Sono pochi kilobyte, e la risposta è quasi
# sempre un 304 vuoto. Vale anche per il carattere, che cambia di rado.
#
# Le immagini restano in cache un'ora: cambiano di rado e non rompono nulla.
[[headers]]
  for = "/assets/og/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
