# Configurazione Netlify per ivanmaggini.com
#
# Il sito è composto da soli file statici: non c'è nessuno step di build, la
# cartella del repository viene pubblicata così com'è.

[build]
  publish = "."
  command = ""

# URL puliti. Netlify offre già la funzione "Pretty URLs", ma dichiarare le
# riscritture qui rende le rotte indipendenti da quell'impostazione: /studio
# serve studio.html senza redirect visibile all'utente né cambio di URL.
# Biglietto non ha più una pagina propria: il racconto è una sezione della
# home, quindi i vecchi indirizzi ci portano dentro invece di sparire.
[[redirects]]
  from = "/startup"
  to = "/#biglietto"
  status = 301

[[redirects]]
  from = "/en/startup"
  to = "/en/#biglietto"
  status = 301

[[redirects]]
  from = "/studio"
  to = "/studio.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/condizioni"
  to = "/condizioni.html"
  status = 200

# Il modulo di contatto non esiste più: si scrive una email e basta. La pagina
# di conferma è stata rimossa, ma la sua rotta resta mappata sulla home perché
# qualcuno potrebbe averla ancora fra i preferiti o in un vecchio messaggio.
[[redirects]]
  from = "/grazie"
  to = "/"
  status = 301

# Versione inglese di home e privacy. La sezione Studio è solo in italiano,
# perché si rivolge agli studi professionali lombardi.
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/en/privacy"
  to = "/en/privacy.html"
  status = 200

# Qualunque altro percorso sotto /en/ riceve la pagina di errore inglese,
# non quella italiana.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

# Il dominio è ivanmaggini.com senza www: la variante con www viene
# reindirizzata in modo permanente per non spezzare l'indicizzazione.
[[redirects]]
  from = "https://www.ivanmaggini.com/*"
  to = "https://ivanmaggini.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Gli asset non hanno un hash nel nome (non c'è un bundler), quindi niente
# `immutable`: il browser rivalida ogni ora e una modifica al CSS si vede
# subito dopo il deploy invece di restare bloccata in cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
