/* ------------------------------------------------------------------
   Biglietto, demo dimostrativa. Tappa 1: il contenitore.

   L'impianto viene dal sito: carta grigia fredda, nero vero per il
   testo, Archivo in larghezza espansa per i dati, Newsreader per la
   prosa. L'ambra è dichiarata ma non usata qui: sul sito vive solo
   dentro il blocco nero, e in questa tappa non c'è niente da
   segnalare. Comparirà quando comparirà il problema.

   Tutto è misurato in cqh, cioè in centesimi dell'altezza del
   rettangolo 16:9. Così la demo si scala intera, senza scrollbar e
   senza salti, su qualunque finestra, ed è sempre inquadrata uguale
   quando si registra.
   ------------------------------------------------------------------ */

:root {
  --paper: #ebebe8;
  --paper-2: #e0e0dc;
  --ink: #000000;
  --ink-soft: rgba(0, 0, 0, 0.72);
  --ink-mute: rgba(0, 0, 0, 0.58);
  --rule: rgba(0, 0, 0, 0.18);
  --rule-strong: rgba(0, 0, 0, 0.4);

  /* Il tabellone e la sua ambra: riservati alle tappe successive. */
  --board: #0c0c0c;
  --board-fg: #ebebe8;
  --signal: #ffab00;

  --display: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --text: 'Newsreader', Georgia, 'Times New Roman', serif;

  --rail: 36cqh;
  --spine: 1.3cqh;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--paper-2);
}

body {
  display: grid;
  place-items: center;
  font-family: var(--text);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* --- il rettangolo 16:9 --------------------------------------------
   Il palco tiene sempre le proporzioni del video. Quello che avanza
   ai lati o sopra e sotto resta carta più scura, così in ripresa si
   vede dove finisce l'inquadratura. */

.stage {
  position: relative;
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9 / 16));
  container-type: size;
  background: var(--paper);
  box-shadow: 0 0 0 1px var(--rule);
  overflow: hidden;
}

.frame {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

/* --- barre in alto e in basso --------------------------------------- */

.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 3cqh;
  padding: 2.2cqh 3.6cqh;
}

.bar.top { border-bottom: 1px solid var(--rule); }

.mark {
  font-family: var(--display);
  font-weight: 700;
  font-stretch: 108%;
  font-size: 2.1cqh;
  letter-spacing: -0.02em;
}

/* La dicitura che dichiara cos'è questa cosa. Sta in alto a destra,
   non si muove e non sparisce mai. */
.sim {
  font-family: var(--display);
  font-weight: 550;
  font-stretch: 84%;
  font-size: 1.5cqh;
  letter-spacing: 0.02em;
  color: var(--ink-mute);
  margin: 0;
}

.controls {
  margin-left: auto;
  display: flex;
  align-items: baseline;
  gap: 2.4cqh;
  font-family: var(--display);
  font-size: 1.5cqh;
  font-weight: 550;
  font-stretch: 84%;
  letter-spacing: 0.02em;
  color: var(--ink-mute);
}

.step {
  color: var(--ink);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.hint[hidden] { display: none; }

/* --- le due colonne -------------------------------------------------
   A sinistra il viaggio come lo chiama chi lo fa, a destra il viaggio
   riga per riga. La linea che le separa è la piegatura di un biglietto:
   fori tondi, come il bordo strappato del blocco nero sul sito. */

.main {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 0;
}

.rail {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 4.4cqh 3.6cqh 3.6cqh 3.6cqh;
}

.rail::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  right: -1.5px;
  width: 3px;
  background-image: radial-gradient(circle at 1.5px 4.5px, var(--rule-strong) 1.1px, transparent 1.5px);
  background-size: 3px 9px;
}

.label {
  font-family: var(--display);
  font-size: 1.5cqh;
  font-weight: 550;
  font-stretch: 82%;
  letter-spacing: 0.02em;
  color: var(--ink-mute);
  margin: 0 0 2.4cqh;
}

.route {
  font-family: var(--display);
  font-weight: 680;
  font-stretch: 115%;
  font-size: 5.4cqh;
  line-height: 1.0;
  letter-spacing: -0.035em;
  margin: 0;
}

.route span { display: block; }

.route .arrow {
  display: inline-block;
  width: 4.8cqh;
  height: 2.6cqh;
  margin-right: 1cqh;
  color: var(--ink-mute);
  vertical-align: 0.02em;
}

.dates {
  font-family: var(--display);
  font-size: 1.7cqh;
  font-weight: 550;
  font-stretch: 88%;
  color: var(--ink-mute);
  margin: 2cqh 0 0;
}

.lede {
  font-size: 2.1cqh;
  line-height: 1.44;
  color: var(--ink);
  margin: 3.4cqh 0 0;
  max-width: 22ch;
}

/* Il conto delle prenotazioni: tre righe di dati, non tre card. Sta in
   fondo alla colonna, così la spalla è appoggiata sopra e sotto e lo
   spazio libero resta in mezzo. */
.facts {
  margin: 4.2cqh 0 0;
  border-top: 1px solid var(--rule);
}

.facts:last-child { margin-top: auto; }

.facts div {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 2cqh;
  padding: 1.25cqh 0;
  border-bottom: 1px solid var(--rule);
}

.facts dt {
  font-family: var(--display);
  font-size: 1.5cqh;
  font-weight: 550;
  font-stretch: 84%;
  color: var(--ink-mute);
}

.facts dd {
  margin: 0;
  font-family: var(--display);
  font-size: 1.9cqh;
  font-weight: 650;
  font-stretch: 100%;
  font-variant-numeric: tabular-nums;
}

/* --- la sequenza ----------------------------------------------------
   Una linea sola scende per tutta la colonna e non si interrompe mai:
   passa dentro le prenotazioni e dentro le attese fra una e l'altra.
   È quello che rende il tutto un viaggio invece di un elenco. */

.trip {
  padding: 3.2cqh 3.6cqh 3.2cqh 4.4cqh;
  min-height: 0;
}

.seq { list-style: none; margin: 0; padding: 0; }

.item {
  position: relative;
  padding-left: 4.4cqh;
}

.item.leg { padding-block: 0.9cqh; }

.item::before {
  content: '';
  position: absolute;
  left: var(--spine);
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--rule-strong);
}

/* La notte in albergo non è uno spostamento: lì la linea si spezza. */
.item[data-kind='stay']::before {
  background: transparent;
  background-image: repeating-linear-gradient(
    to bottom,
    var(--rule-strong) 0 3px,
    transparent 3px 8px
  );
}

/* Ora, luogo e mezzo stanno stretti a sinistra; chi ha venduto il pezzo
   va a filo destro, in colonna. È la riga del tabellone del sito: il
   dato che conta a sinistra, la sua provenienza in fondo. Il vuoto in
   mezzo separa due colonne, non spezza una riga. */
.row {
  position: relative;
  display: grid;
  grid-template-columns: 7.4cqh minmax(26cqh, max-content) 15cqh minmax(21cqh, 1fr);
  column-gap: 2.6cqh;
  align-items: baseline;
  padding: 0.85cqh 0;
}

.row > :last-child {
  justify-self: end;
  text-align: right;
  white-space: nowrap;
}

/* I nodi stanno sulla linea, all'altezza esatta dell'orario. Pieno
   quando si parte, vuoto quando si arriva. */
.node {
  position: absolute;
  left: calc(var(--spine) - 4.4cqh);
  top: 50%;
  width: 1.05cqh;
  height: 1.05cqh;
  transform: translate(-50%, -50%);
  background: var(--ink);
}

.node.hollow {
  background: var(--paper);
  box-shadow: inset 0 0 0 1.5px var(--ink);
}

.t {
  font-family: var(--display);
  font-size: 2.65cqh;
  font-weight: 600;
  font-stretch: 96%;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.place {
  font-family: var(--display);
  font-size: 2.9cqh;
  font-weight: 660;
  font-stretch: 110%;
  letter-spacing: -0.022em;
  line-height: 1.12;
}

/* Il mezzo e il venditore: la seconda cosa che si legge, non la prima. */
.mode {
  display: flex;
  align-items: center;
  gap: 0.85cqh;
  font-family: var(--display);
  font-size: 1.85cqh;
  font-weight: 600;
  font-stretch: 90%;
}

.mode svg {
  width: 2cqh;
  height: 2cqh;
  flex: none;
  align-self: center;
}

.seller {
  font-family: var(--display);
  font-size: 1.85cqh;
  font-weight: 600;
  font-stretch: 90%;
}

.meta {
  font-family: var(--display);
  font-size: 1.55cqh;
  font-weight: 500;
  font-stretch: 84%;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

/* --- attese e cambio di giornata ------------------------------------- */

.gap { padding-top: 2cqh; padding-bottom: 2cqh; }

.gap p {
  margin: 0;
  font-size: 1.85cqh;
  line-height: 1.4;
  color: var(--ink-mute);
}

.day { padding-top: 2.1cqh; padding-bottom: 2.1cqh; }

.day p {
  margin: 0;
  font-family: var(--display);
  font-size: 1.6cqh;
  font-weight: 650;
  font-stretch: 84%;
  letter-spacing: 0.03em;
}

/* Il cambio di giornata attraversa la linea invece di interromperla. */
.day .node {
  left: calc(var(--spine) - 4.4cqh);
  width: 2.6cqh;
  height: 1.5px;
  background: var(--ink);
  box-shadow: none;
}

.day .mark-row { position: relative; }

/* --- movimento -------------------------------------------------------
   In questa tappa non si muove niente da solo. La regola resta scritta
   perché le tappe successive cambiano contenuto a comando. */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

</style>
</head>

<body>

<main class="stage" id="stage" tabindex="-1">
  <div class="frame">

    <header class="bar top">
      <span class="mark">Biglietto</span>
      <p class="sim">Simulation with sample data</p>
    </header>

    <div class="main">
      <div class="rail" id="rail"></div>
      <div class="trip">
        <ol class="seq" id="seq"></ol>
      </div>
    </div>

    <footer class="bar bottom">
      <div class="controls">
        <span class="step" id="step">1 / 1</span>
        <span class="hint" id="hint" hidden></span>
      </div>
    </footer>

  </div>
</main>

<script src="data.js"></script>
<script src="demo.js"></script>

</body>
</html>
